<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: background 0.5s ease-in-out;
            background: linear-gradient(to right, #4CAF50, #2196F3);
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 350px;
        }
        h2 {
            color: #333;
        }
        input {
            padding: 10px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1565C0;
        }
        #weather-info {
            display: none;
            margin-top: 20px;
        }
        #weather-icon {
            width: 100px;
        }
        .temp-toggle {
            cursor: pointer;
            font-size: 14px;
            color: #1565C0;
            text-decoration: underline;
        }
        .highlight {
            font-weight: bold;
        }
        .highlight.temp { color: #e91e63; }
        .highlight.humidity { color: #3f51b5; }
        .highlight.wind { color: #ff9800; }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Weather App</h2>
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="fetchWeather()">Get Weather</button>
        <p class="error" id="error-message"></p>

        <div id="weather-info">
            <h3 id="city-name"></h3>
            <p id="date"></p>
            <img id="weather-icon" src="" alt="Weather Icon">
            <p class="highlight temp" id="temperature"></p>
            <p class="highlight humidity" id="humidity"></p>
            <p class="highlight wind" id="wind-speed"></p>
            <p id="description"></p>
            <p class="temp-toggle" onclick="toggleTemperature()">Switch to °F</p>
        </div>
    </div>

    <script>
        const apiKey = '1ab6876e5b753073005d0de91d7e3abf'; // Replace with your OpenWeather API key
        let isCelsius = true;

        async function fetchWeather() {
            const city = document.getElementById('city').value.trim();
            if (!city) {
                document.getElementById('error-message').textContent = "Please enter a city name.";
                return;
            }

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            // Show loading state immediately
            document.getElementById('error-message').textContent = "Fetching data...";
            
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("City not found.");
                    return response.json();
                })
                .then(data => {
                    displayWeather(data);
                })
                .catch(error => {
                    document.getElementById('error-message').textContent = "City not found. Please try again.";
                    document.getElementById('weather-info').style.display = "none";
                });
        }

        function displayWeather(data) {
            document.getElementById('error-message').textContent = "";
            document.getElementById('city-name').textContent = data.name;
            document.getElementById('date').textContent = new Date().toLocaleString();
            document.getElementById('temperature').textContent = `Temperature: ${data.main.temp}°C`;
            document.getElementById('humidity').textContent = `Humidity: ${data.main.humidity}%`;
            document.getElementById('wind-speed').textContent = `Wind Speed: ${data.wind.speed} m/s`;
            document.getElementById('description').textContent = `Weather: ${data.weather[0].description}`;

            const weatherIcon = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
            document.getElementById('weather-icon').src = weatherIcon;

            changeBackground(data.weather[0].main);
            document.getElementById('weather-info').style.display = "block";
        }

        function toggleTemperature() {
            let tempText = document.getElementById('temperature').textContent;
            let currentTemp = parseFloat(tempText.split(": ")[1]);

            if (isCelsius) {
                let fahrenheit = (currentTemp * 9/5) + 32;
                document.getElementById('temperature').textContent = `Temperature: ${fahrenheit.toFixed(1)}°F`;
                document.querySelector('.temp-toggle').textContent = "Switch to °C";
            } else {
                let celsius = (currentTemp - 32) * 5/9;
                document.getElementById('temperature').textContent = `Temperature: ${celsius.toFixed(1)}°C`;
                document.querySelector('.temp-toggle').textContent = "Switch to °F";
            }

            isCelsius = !isCelsius;
        }

        function changeBackground(weatherCondition) {
            const conditions = {
                "Clear": "linear-gradient(to right, #FFD700, #FFA500)",
                "Clouds": "linear-gradient(to right, #B0BEC5, #78909C)",
                "Rain": "linear-gradient(to right, #607D8B, #455A64)",
                "Drizzle": "linear-gradient(to right, #76b3f0, #0b66c2)",
                "Thunderstorm": "linear-gradient(to right, #4E342E, #212121)",
                "Snow": "linear-gradient(to right, #E0F7FA, #80DEEA)",
                "Mist": "linear-gradient(to right, #CFD8DC, #90A4AE)"
            };
            document.body.style.background = conditions[weatherCondition] || "linear-gradient(to right, #4CAF50, #2196F3)";
        }
    </script>

</body>
</html>
